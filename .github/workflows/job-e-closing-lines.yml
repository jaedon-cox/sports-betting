# Job E — closing-line capture (backend doc §2.4, §2.5). The CLV anchor.
#
# Six triggers, positioned ~15 minutes before each known MLB start-time cluster
# (day games ~1pm and ~4pm ET, the ~7pm wave, ~7:35pm, and the two West-coast
# waves ~9:40pm and ~10:05pm). Each does ONE free StatsAPI schedule check,
# sweeps only if a game is genuinely inside its T-20..T-1 window, and exits.
# §2.2 measured the alternative — a continuous 5-minute checker — at ~150
# billed min/day, which blows the 2000/month cap in about a week.
#
# **No DST guard step, deliberately.** The window test compares UTC instants
# (games.start_time_utc vs now), so it is offset-independent: a trigger an hour
# out of position simply finds nothing in window and costs one billed minute.
# What DST *does* break is coverage — under EST the evening clusters move an
# hour later in UTC and would have no trigger near them — so three hedge crons
# are scheduled in November only, which is the sole month the season can still
# be running after the changeover. Cron's month field is what makes that free
# the other eleven months.
#
# 01:20 and 01:50 UTC are the *previous* ET evening; the 3-11 month filter is on
# the UTC date, so the last evening of October is still covered (Nov 1 UTC).
name: Job E — closing-line capture

on:
  schedule:
    - cron: "45 16 * 3-11 *"   # ~12:45 ET — before the ~1pm day-game cluster
    - cron: "45 19 * 3-11 *"   # ~15:45 ET — before the ~4pm cluster
    - cron: "45 22 * 3-11 *"   # ~18:45 ET — before the ~7pm wave
    - cron: "20 23 * 3-11 *"   # ~19:20 ET — before the ~7:35pm wave
    - cron: "20 1 * 3-11 *"    # ~21:20 ET — before the ~9:40pm West-coast wave
    - cron: "50 1 * 3-11 *"    # ~21:50 ET — before the ~10:05pm wave
    - cron: "45 23 * 11 *"     # EST hedge: ~18:45 ET
    - cron: "20 0 * 11 *"      # EST hedge: ~19:20 ET
    - cron: "20 2 * 11 *"      # EST hedge: ~21:20 ET
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-e-closing-lines
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -m sbm.jobs e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SBM_DAILY_ODDS_CREDITS: ${{ vars.SBM_DAILY_ODDS_CREDITS }}
